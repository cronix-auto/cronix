name: Cronix UI Render
on:
  push:
    branches: [cronix-ui-preview]
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Render shared native UI
        timeout-minutes: 12
        run: bash preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cronix-UI-Previews
          path: previews/*
