name: Rose native UI preview
on:
  push:
    branches: [dopamine-rose-build]
    paths: [dopamine-rose/preview.py, dopamine-rose/ui/**, .github/workflows/rose-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build actual frontend with isolated simulator fixtures
        run: |
          python3 -m pip install --user --break-system-packages pillow
          python3 dopamine-rose/preview.py
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator clang -arch arm64 -isysroot "$SDK" -mios-simulator-version-min=15.0 -fobjc-arc -fmodules -framework UIKit -framework Foundation preview/main.m -o preview/RosePreview.app/RosePreview
      - name: Render compact iPhone UI states
        run: |
          set -eux
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if "iOS" in r["name"] and r["isAvailable"]))')
          DEVICE=$(xcrun simctl create "Rose 375x667" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$RUNTIME")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" preview/RosePreview.app
          mkdir screenshots
          for SCREEN in home device library recovery logs progress unsupported active removal; do
            xcrun simctl launch --terminate-running-process "$DEVICE" dev.rose.preview "$SCREEN"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "screenshots/$SCREEN.png"
          done
          xcrun simctl spawn "$DEVICE" log show --last 3m --predicate 'process == "RosePreview"' > screenshots/runtime.log
          echo "Production UIKit views, isolated engine fixtures, current simulator OS at 375x667 points. Not iOS 15 or jailbreak proof." > screenshots/README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rose-UI-preview
          path: screenshots

